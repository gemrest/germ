# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "germ"
version = "0.5.2"
authors = ["Fuwn <contact@fuwn.me>"]
edition = "2021"
description = "The Ultimate Gemini Toolkit."
documentation = "https://docs.rs/germ"
readme = "README.md"
homepage = "https://github.com/gemrest/germ"
repository = "https://github.com/gemrest/germ"
license = "MIT OR Apache-2.0"
keywords = ["gemini", "parser", "lexer", "markdown", "converter"]
categories = ["encoding"]
rust-version = "1.85.0"

[features]
ast = []
blocking = ["rustls", "webpki-roots", "x509-cert", "url", "anyhow"]
convert = ["ast"]
default = ["ast", "convert", "meta", "request"]
macros = ["ast", "convert"]
meta = []
request = ["rustls", "webpki-roots", "x509-cert", "url", "anyhow", "tokio", "tokio-rustls"]
quick = []

[[example]]
name = "ast"
required-features = ["ast"]

[[example]]
name = "ast_to_gemtext"
required-features = ["ast"]

[[example]]
name = "html"
required-features = ["convert"]

[[example]]
name = "html_custom"
required-features = ["convert"]

[[example]]
name = "markdown"
required-features = ["convert"]

[[example]]
name = "meta"
required-features = ["meta"]

[[example]]
name = "request"
required-features = ["request"]

[[example]]
name = "request_blocking"
required-features = ["blocking"]

[[example]]
name = "request_blocking_to_gemtext_from_ast"
required-features = ["ast", "blocking"]

[dependencies]
anyhow = { version = "1.0.104", optional = true } # `Result`
rustls = { version = "0.23.46", optional = true, default-features = false, features = ["ring", "std", "tls12"] } # TLS
webpki-roots = { version = "1.0.11", optional = true } # CA certificates
x509-cert = { version = "0.3.0", optional = true, default-features = false } # Certificate parsing
tokio-rustls = { version = "0.26.6", optional = true, default-features = false, features = ["ring", "tls12"] } # Non-blocking TLS
tokio = { version = "1.54.1", optional = true, default-features = false, features = [
  "net",
  "io-util",
  "rt-multi-thread",
  "macros",
  "time",
] } # Non-blocking I/O
url = { version = "2.5.8", optional = true } # URL Validation

[dev-dependencies]
rcgen = { version = "0.14.7", default-features = false, features = ["ring"] }
